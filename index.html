<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qlynt Relocation Optimizer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-4xl w-full grid grid-cols-1 md:grid-cols-5 gap-6">
        <div class="md:col-span-2 bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
            <h2 class="text-xl font-bold text-emerald-400 mb-1">Relocation Optimizer 🚀</h2>
            <form id="optimizerForm" class="space-y-3">
                <input type="text" id="office" placeholder="Workplace Address" class="w-full bg-slate-800 p-2 text-sm rounded-lg" required>
                <input type="number" id="budget" placeholder="Max Rent (₹)" class="w-full bg-slate-800 p-2 text-sm rounded-lg" required>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="bhk" placeholder="BHK" class="w-full bg-slate-800 p-2 text-sm rounded-lg">
                    <input type="number" id="size" placeholder="Sq. Ft." class="w-full bg-slate-800 p-2 text-sm rounded-lg">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="bath" placeholder="Bathrooms" class="w-full bg-slate-800 p-2 text-sm rounded-lg">
                    <select id="area_type" class="w-full bg-slate-800 p-2 text-sm rounded-lg">
                        <option value="Super Area">Super Area</option>
                        <option value="Carpet Area">Carpet Area</option>
                    </select>
                </div>
                <select id="furnishing" class="w-full bg-slate-800 p-2 text-sm rounded-lg">
                    <option value="Unfurnished">Unfurnished</option>
                    <option value="Semi-Furnished">Semi-Furnished</option>
                    <option value="Fully Furnished">Fully Furnished</option>
                </select>
                <select id="tenant" class="w-full bg-slate-800 p-2 text-sm rounded-lg">
                    <option value="Bachelors/Family">Bachelors/Family</option>
                    <option value="Bachelors">Bachelors</option>
                    <option value="Family">Family</option>
                </select>
                <button type="submit" class="w-full bg-emerald-500 p-3 rounded-xl font-bold text-slate-950">Find Localities</button>
            </form>
        </div>
        <div class="md:col-span-3 bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl" id="resultsContainer">
            <p class="text-slate-500">Enter details to see results.</p>
        </div>
    </div>
    <script>
        document.getElementById('optimizerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                office_location: document.getElementById('office').value,
                max_budget: parseFloat(document.getElementById('budget').value),
                preferred_bhk: parseInt(document.getElementById('bhk').value),
                property_size: parseFloat(document.getElementById('size').value),
                furnishing_status: document.getElementById('furnishing').value,
                bathrooms: parseInt(document.getElementById('bath').value),
                area_type: document.getElementById('area_type').value,
                tenant_preference: document.getElementById('tenant').value
            };
            const response = await fetch('/optimize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            const container = document.getElementById('resultsContainer');
            container.innerHTML = data.recommendations.map(r => `
                <div class="bg-slate-800 p-4 mb-2 rounded-lg flex justify-between">
                    <div><h4 class="font-bold text-emerald-400">${r.locality}</h4></div>
                    <div>₹${r.predicted_rent.toLocaleString()}</div>
                </div>`).join('');
        });
    </script>
</body>
</html>
