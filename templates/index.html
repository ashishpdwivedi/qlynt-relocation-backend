<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Qlynt — Relocation Optimizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4">
    <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-5 gap-6">
        <div class="md:col-span-2 bg-slate-900 p-6 rounded-2xl border border-slate-800">
            <h2 class="text-xl font-bold text-emerald-400 mb-4">Relocation Optimizer 🚀</h2>
            <form id="optimizerForm" class="space-y-3">
                <input type="text" id="office" placeholder="Workplace Address" class="w-full bg-slate-800 p-3 rounded-lg border border-slate-700" required>
                <input type="number" id="budget" placeholder="Max Rent (₹)" class="w-full bg-slate-800 p-3 rounded-lg border border-slate-700" required>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="bhk" placeholder="BHK" required class="w-full bg-slate-800 p-3 rounded-lg border border-slate-700">
                    <input type="number" id="size" placeholder="Sq. Ft." required class="w-full bg-slate-800 p-3 rounded-lg border border-slate-700">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="bath" placeholder="Bathrooms" required class="w-full bg-slate-800 p-3 rounded-lg border border-slate-700">
                    <select id="area_type" class="w-full bg-slate-800 p-3 rounded-lg border border-slate-700">
                        <option value="Super Area">Super Area</option>
                        <option value="Carpet Area">Carpet Area</option>
                    </select>
                </div>
                <select id="furnishing" class="w-full bg-slate-800 p-3 rounded-lg border border-slate-700">
                    <option value="Unfurnished">Unfurnished</option>
                    <option value="Semi-Furnished">Semi-Furnished</option>
                    <option value="Fully Furnished">Fully Furnished</option>
                </select>
                <select id="tenant" class="w-full bg-slate-800 p-3 rounded-lg border border-slate-700">
                    <option value="Bachelors/Family">Bachelors/Family</option>
                    <option value="Bachelors">Bachelors</option>
                    <option value="Family">Family</option>
                </select>
                <button type="submit" class="w-full bg-emerald-500 p-3 rounded-xl font-bold text-slate-950 transition">Find Localities</button>
            </form>
        </div>
        <div class="md:col-span-3 bg-slate-900 p-6 rounded-2xl border border-slate-800" id="resultsContainer">
            <p class="text-slate-500 italic">Enter location details to generate estimates...</p>
        </div>
    </div>
    <script>
        document.getElementById('optimizerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const container = document.getElementById('resultsContainer');
            container.innerHTML = `<p class="text-emerald-400">Calculating...</p>`;
            const payload = {
                office_location: document.getElementById('office').value,
                max_budget: parseFloat(document.getElementById('budget').value),
                preferred_bhk: parseInt(document.getElementById('bhk').value),
                property_size: parseFloat(document.getElementById('size').value),
                furnishing_status: document.getElementById('furnishing').value,
                bathrooms: parseInt(document.getElementById('bath').value),
                area_type: document.getElementById('area_type').value,
                tenant_preference: document.getElementById('tenant').value
            };
            const res = await fetch('/optimize', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            const data = await res.json();
            if (data.success) {
                container.innerHTML = data.recommendations.map(r => `
                    <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl flex justify-between items-center mb-2">
                        <div><h4 class="font-bold text-emerald-400">${r.locality}</h4><p class="text-xs">${r.distance_km}km away</p></div>
                        <div class="font-bold text-lg">₹${r.predicted_rent.toLocaleString()}</div>
                    </div>`).join('');
            } else { container.innerHTML = `<p class="text-rose-500">Error: ${data.error}</p>`; }
        });
    </script>
</body>
</html>
